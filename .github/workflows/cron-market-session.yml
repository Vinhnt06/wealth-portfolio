name: 📈 YourFin Market Post-Session Auto-Sync

on:
  schedule:
    # 1. Phiên Sáng: Chốt phiên 11:30 (Mốc chính 11:37 và 3 mốc dự phòng 11:47, 12:05, 12:30 VN / 04:37, 04:47, 05:05, 05:30 UTC)
    - cron: '37 4 * * 1-5'
    - cron: '47 4 * * 1-5'
    - cron: '05 5 * * 1-5'
    - cron: '30 5 * * 1-5'

    # 2. Phiên Chiều & Tối: Chốt phiên ATC 15:00 và toàn bộ các mốc dự phòng phủ kín đến đêm
    # 15:17, 15:35, 15:52, 16:15, 16:45, 17:15, 18:15, 20:15, 22:15 VN (Thứ 2 - Thứ 6)
    - cron: '17 8 * * 1-5'
    - cron: '35 8 * * 1-5'
    - cron: '52 8 * * 1-5'
    - cron: '15 9 * * 1-5'
    - cron: '45 9 * * 1-5'
    - cron: '15 10 * * 1-5'
    - cron: '15 11 * * 1-5'
    - cron: '15 13 * * 1-5'
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # Cho phép trigger thủ công trực tiếp từ GitHub Actions bất kỳ lúc nào

concurrency:
  group: market-sync-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-market-session:
    name: 📊 Chốt Dữ Liệu Dòng Tiền Ngành & Quét Minervini
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🚀 Chốt Lịch Sử Dòng Tiền Ngành (Entrade API)
        run: |
          node scripts/build_sector_flow_history.js

      - name: 🔍 Quét Bộ Lọc Cổ Phiếu Minervini Trend Template
        run: |
          node scripts/cron_scan_minervini.js

      - name: 💾 Commit & Push Dữ Liệu Sau Phiên Lên Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/src/features/market/data/sector_flow_history.json frontend/src/features/market/data/lastMinerviniScan.json data/stock_rs_ratings.json
          if git diff --staged --quiet; then
            echo "✅ Dữ liệu đã là mới nhất, không có thay đổi cần commit."
          else
            git commit -m "chore(data): auto-sync market sector flow and minervini screener after session"
            git pull --rebase origin main || true
            git push origin main
            echo "🚀 Đã cập nhật và đẩy dữ liệu chốt phiên thành công lên production!"
          fi
