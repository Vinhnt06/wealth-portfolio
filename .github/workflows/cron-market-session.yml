name: 📈 YourFin Market Post-Session Auto-Sync

on:
  schedule:
    # 1. Phiên Sáng: Chốt phiên lúc 11:35 (với các khung giờ dự phòng 11:37, 11:50 VN / 04:37, 04:50 UTC)
    - cron: '37 4 * * 1-5'
    - cron: '50 4 * * 1-5'
    # 2. Phiên Chiều: Chốt phiên lúc 15:17 (với các khung giờ dự phòng 15:35, 16:05, 16:30 VN / 08:17, 08:35, 09:05, 09:30 UTC)
    - cron: '17 8 * * 1-5'
    - cron: '35 8 * * 1-5'
    - cron: '05 9 * * 1-5'
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Cho phép trigger thủ công trực tiếp từ GitHub Actions bất kỳ lúc nào

permissions:
  contents: write

jobs:
  sync-market-session:
    name: 📊 Chốt Dữ Liệu Dòng Tiền Ngành & Quét Minervini
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🚀 Chốt Lịch Sử Dòng Tiền Ngành (Entrade API)
        run: |
          node scripts/build_sector_flow_history.js

      - name: 🔍 Quét Bộ Lọc Cổ Phiếu Minervini Trend Template
        run: |
          node scripts/cron_scan_minervini.js

      - name: 💾 Commit & Push Dữ Liệu Sau Phiên Lên Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/src/features/market/data/sector_flow_history.json frontend/src/features/market/data/lastMinerviniScan.json data/stock_rs_ratings.json
          if git diff --staged --quiet; then
            echo "✅ Dữ liệu đã là mới nhất, không có thay đổi cần commit."
          else
            git commit -m "chore(data): auto-sync market sector flow and minervini screener after session"
            git push origin main
            echo "🚀 Đã cập nhật và đẩy dữ liệu chốt phiên thành công lên production!"
          fi
