name: 🔄 YourFin Macro & Interest Rates Auto-Sync

on:
  schedule:
    # Chạy 2 lần mỗi ngày trên Cloud GitHub: 00:00 UTC (07:00 VN) và 11:00 UTC (18:00 VN sau giờ giao dịch)
    - cron: '0 0,11 * * *'
  workflow_dispatch: # Cho phép trigger thủ công từ GitHub UI

jobs:
  sync-macro:
    name: 🌐 Crawl & Sync Macro Data to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd frontend
          npm install @supabase/supabase-js dotenv --no-save

      - name: Execute Cron Macro Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scripts/cron_update_macro.js || echo "Sync completed with warnings"
