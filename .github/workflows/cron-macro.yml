name: 🔄 YourFin Macro & Interest Rates Auto-Sync

on:
  schedule:
    # Chạy đồng bộ vĩ mô: 07:12 VN (00:12 UTC), 18:12 VN (11:12 UTC) và dự phòng tối 20:12 VN (13:12 UTC)
    - cron: '12 0,11,13 * * *'
  workflow_dispatch: # Cho phép trigger thủ công từ GitHub UI

permissions:
  contents: write

jobs:
  sync-macro:
    name: 🌐 Crawl & Sync Macro Data to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd frontend
          npm install @supabase/supabase-js dotenv --no-save

      - name: Execute Cron Macro Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node scripts/cron_update_macro.js

      - name: Commit updated macroDatabase.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/src/features/market/data/macroDatabase.json
          if git diff --staged --quiet; then
            echo "Không có số liệu vĩ mô mới."
          else
            git commit -m "chore(data): auto-sync Vietnam macro (GDP, CPI, rates)"
            git pull --rebase origin main || true
            git push origin main
          fi
